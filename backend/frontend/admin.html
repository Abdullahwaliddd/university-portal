<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFuture Admin</title>
    <style>
        :root {
            --oxford: #192338;
            --cadet: #1E2E4F;
            --yinmn: #31487A;
            --jordy: #8FB3E2;
            --lavender: #D9E1F1;
            --white: #fff;
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-light: #8b949e;
            --accent: #58a6ff;
            --danger: #f85149;
            --success: #3fb950;
            --warning: #d2991d;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 240px; background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
        .sidebar h2 { font-size: 20px; margin-bottom: 30px; color: var(--jordy); }
        .sidebar nav a { display: block; padding: 10px 15px; color: var(--text-light); text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .sidebar nav a:hover, .sidebar nav a.active { background: var(--yinmn); color: white; }
        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .topbar h1 { font-size: 28px; }
        .btn { padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--yinmn); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-accept { background: var(--success); color: white; }
        .btn-reject { background: var(--warning); color: black; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .stat-card h3 { font-size: 36px; color: var(--accent); }
        .stat-card p { color: var(--text-light); margin-top: 5px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-light); font-weight: 600; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 30px; width: 500px; max-width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: var(--text-light); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--dark-bg); color: var(--text); }
        .flex { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status.accepted { background: rgba(63,185,80,0.2); color: var(--success); }
        .status.rejected { background: rgba(248,81,73,0.2); color: var(--danger); }
        .status.pending { background: rgba(210,153,29,0.2); color: var(--warning); }
        .badge { background: var(--yinmn); padding: 3px 8px; border-radius: 12px; font-size: 12px; }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🎓 EduFuture</h2>
        <nav>
            <a class="active" onclick="showTab('dashboard', this)">📊 Dashboard</a>
            <a onclick="showTab('students', this)">👨‍🎓 Students</a>
            <a onclick="showTab('applications', this)">📝 Applications</a>
            <a onclick="showTab('universities', this)">🏛️ Universities</a>
            <a onclick="showTab('majors', this)">🎓 Majors</a>
            <a onclick="showTab('studyplans', this)">📚 Study Plans</a>
        </nav>
        <div style="margin-top:auto;">
            <button class="btn btn-outline" onclick="adminLogout()" style="width:100%">🚪 Logout</button>
        </div>
    </div>
    <div class="main" id="mainContent"></div>
    <div id="modal" class="modal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        const API = window.location.origin + '/api/admin';
        const currentAdmin = JSON.parse(localStorage.getItem('adminUser') || 'null');
        if (!currentAdmin) {
    // Reset body styles for full‑screen centering
    document.body.style.display = 'flex';
    document.body.style.alignItems = 'center';
    document.body.style.justifyContent = 'center';
    document.body.style.height = '100vh';
    document.body.style.background = 'var(--dark-bg)';
    document.body.style.overflow = 'hidden';
    document.body.innerHTML = `
        <div style="width:100%; max-width:400px; background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 30px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);">
            <h2 style="margin-bottom:20px;color:var(--jordy); text-align:center;">Admin Login</h2>
            <form onsubmit="adminLogin(event)">
                <div class="form-group">
                    <input type="email" id="adminEmail" placeholder="Email" required 
                           style="width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;background:var(--dark-bg);color:var(--text);">
                </div>
                <div class="form-group">
                    <input type="password" id="adminPassword" placeholder="Password" required 
                           style="width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;background:var(--dark-bg);color:var(--text);">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
            </form>
            <div id="loginMsg" style="margin-top:15px;color:var(--danger); text-align:center;"></div>
        </div>`;
    return;
}

        function adminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            fetch(`${API}/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            })
            .then(r => r.json())
            .then(data => {
                if (data.admin) {
                    localStorage.setItem('adminUser', JSON.stringify(data.admin));
                    location.reload();
                } else {
                    document.getElementById('loginMsg').textContent = 'Invalid credentials';
                }
            });
        }

        function adminLogout() { localStorage.removeItem('adminUser'); location.reload(); }

        function showTab(tab, el) {
            document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
            if (el) el.classList.add('active');
            switch(tab) {
                case 'dashboard': loadDashboard(); break;
                case 'students': loadStudents(); break;
                case 'applications': loadApplications(); break;
                case 'universities': loadUniversities(); break;
                case 'majors': loadMajors(); break;
                case 'studyplans': loadStudyPlans(); break;
            }
        }

        // ---------- DASHBOARD ----------
        async function loadDashboard() {
            const res = await fetch(`${API}/stats`);
            const stats = await res.json();
            document.getElementById('mainContent').innerHTML = `
                <div class="topbar"><h1>Dashboard</h1></div>
                <div class="stats-grid">
                    <div class="stat-card"><h3>${stats.universities}</h3><p>Universities</p></div>
                    <div class="stat-card"><h3>${stats.colleges}</h3><p>Colleges</p></div>
                    <div class="stat-card"><h3>${stats.majors}</h3><p>Majors</p></div>
                    <div class="stat-card"><h3>${stats.students}</h3><p>Students</p></div>
                    <div class="stat-card"><h3>${stats.applications}</h3><p>Applications</p></div>
                    <div class="stat-card"><h3>${stats.courses}</h3><p>Courses</p></div>
                </div>`;
        }

        // ---------- STUDENTS ----------
        async function loadStudents() {
            const res = await fetch(`${API}/students`);
            const students = await res.json();
            document.getElementById('mainContent').innerHTML = `
                <div class="topbar"><h1>Students</h1></div>
                <div class="card"><table>
                    <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Gender</th><th>Phone</th><th>Action</th></tr></thead>
                    <tbody>${students.map(s => `
                        <tr><td>${s.Student_ID}</td><td>${s.First_Name} ${s.Last_Name}</td><td>${s.Email}</td><td>${s.Gender||'-'}</td><td>${s.Phone||'-'}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteStudent(${s.Student_ID})">Delete</button></td></tr>
                    `).join('')}</tbody>
                </table></div>`;
        }
        async function deleteStudent(id) { if(confirm('Delete this student?')) { await fetch(`${API}/students/${id}`, {method:'DELETE'}); loadStudents(); } }

        // ---------- APPLICATIONS ----------
        async function loadApplications() {
            const res = await fetch(`${API}/applications`);
            const apps = await res.json();
            document.getElementById('mainContent').innerHTML = `
                <div class="topbar"><h1>Applications</h1></div>
                <div class="card"><table>
                    <thead><tr><th>ID</th><th>Student</th><th>Major</th><th>University</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody>${apps.map(a => `
                        <tr>
                            <td>${a.Application_ID}</td><td>${a.First_Name} ${a.Last_Name}</td><td>${a.Major_Name}</td><td>${a.University_Name}</td>
                            <td><span class="status ${a.Status.toLowerCase()}">${a.Status}</span></td>
                            <td>
                                <button class="btn btn-accept btn-sm" onclick="updateApp(${a.Application_ID},'Accepted')">Accept</button>
                                <button class="btn btn-reject btn-sm" onclick="updateApp(${a.Application_ID},'Rejected')">Reject</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteApp(${a.Application_ID})">Delete</button>
                            </td>
                        </tr>
                    `).join('')}</tbody>
                </table></div>`;
        }
        async function updateApp(id, status) { await fetch(`${API}/applications/${id}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify({status})}); loadApplications(); }
        async function deleteApp(id) { if(confirm('Delete this application?')) { await fetch(`${API}/applications/${id}`, {method:'DELETE'}); loadApplications(); } }

        // ---------- UNIVERSITIES (with gallery) ----------
        async function loadUniversities() {
            const res = await fetch(`${API}/universities`);
            const unis = await res.json();
            document.getElementById('mainContent').innerHTML = `
                <div class="topbar"><h1>Universities</h1><button class="btn btn-primary" onclick="openUniModal()">+ Add University</button></div>
                <div class="stats-grid" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));">
                    ${unis.map(u => `
                        <div class="card" style="padding:15px;">
                            <h3>${u.Name}</h3>
                            <p style="color:var(--text-light);font-size:13px;">${u.Type||'N/A'} | ${u.Location||'N/A'}</p>
                            ${u.photo ? `<img src="${u.photo}" style="max-width:100%;border-radius:8px;margin:5px 0;">` : ''}
                            <div style="margin-top:10px;">
                                <button class="btn btn-outline btn-sm" onclick="openUniModal(${u.University_ID})">Edit</button>
                                <button class="btn btn-danger btn-sm" onclick="deleteUni(${u.University_ID})">Delete</button>
                            </div>
                        </div>
                    `).join('')}
                </div>`;
        }

        async function openUniModal(id = null) {
            const modal = document.getElementById('modal');
            const isEdit = id !== null;
            let uni = {Name:'', Type:'', Location:'', Email:'', Phone:'', Website:'', photo:'', photos:'[]'};
            if (isEdit) {
                const res = await fetch(`${API}/universities/${id}`);
                uni = await res.json();
            }
            let galleryPhotos = [];
            try { galleryPhotos = JSON.parse(uni.photos || '[]'); } catch(e) { galleryPhotos = []; }

            document.getElementById('modalBody').innerHTML = `
                <h3>${isEdit ? 'Edit' : 'Add'} University</h3>
                <div class="form-group"><label>Name</label><input id="uniName" value="${uni.Name||''}"></div>
                <div class="form-group"><label>Type</label><input id="uniType" value="${uni.Type||''}"></div>
                <div class="form-group"><label>Location</label><input id="uniLoc" value="${uni.Location||''}"></div>
                <div class="form-group"><label>Email</label><input id="uniEmail" value="${uni.Email||''}"></div>
                <div class="form-group"><label>Phone</label><input id="uniPhone" value="${uni.Phone||''}"></div>
                <div class="form-group"><label>Website</label><input id="uniWeb" value="${uni.Website||''}"></div>
                <div class="form-group"><label>Main Photo</label>
                    <input type="file" id="uniPhoto" accept="image/*">
                    ${uni.photo ? `<img src="${uni.photo}" style="max-width:150px;margin-top:10px;border-radius:8px;">` : ''}
                </div>
                <hr style="border-color: var(--border); margin: 20px 0;">
                <h4>📸 Campus Gallery</h4>
                <div id="galleryPreview" style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:10px;">
                    ${galleryPhotos.map(p => `
                        <div style="position:relative;">
                            <img src="${p}" style="width:100px; height:70px; object-fit:cover; border-radius:6px;">
                            <button class="btn btn-danger btn-sm" style="position:absolute; top:-5px; right:-5px;" onclick="deleteGalleryPhoto(${id}, '${p}')">×</button>
                        </div>
                    `).join('')}
                </div>
                <input type="file" id="galleryPhoto" accept="image/*" multiple>
                <button class="btn btn-outline btn-sm" onclick="uploadGalleryPhoto(${id})">Upload to Gallery</button>
                <div class="flex" style="margin-top:20px;">
                    <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveUni(${isEdit ? id : null})">Save</button>
                </div>`;
            modal.classList.add('active');
        }

        async function saveUni(id) {
            const data = {
                Name: document.getElementById('uniName').value,
                Type: document.getElementById('uniType').value,
                Location: document.getElementById('uniLoc').value,
                Email: document.getElementById('uniEmail').value,
                Phone: document.getElementById('uniPhone').value,
                Website: document.getElementById('uniWeb').value
            };
            const url = id ? `${API}/universities/${id}` : `${API}/universities`;
            const method = id ? 'PUT' : 'POST';
            const res = await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
            const result = await res.json();

            const uniId = id || result.id;
            const fileInput = document.getElementById('uniPhoto');
            if (fileInput && fileInput.files[0]) {
                const formData = new FormData();
                formData.append('photo', fileInput.files[0]);
                await fetch(`${API}/universities/${uniId}/photo`, { method: 'POST', body: formData });
            }
            closeModal();
            loadUniversities();
        }

        async function uploadGalleryPhoto(uniId) {
            const fileInput = document.getElementById('galleryPhoto');
            if (!fileInput.files.length) return alert('Please select at least one image');
            for (let file of fileInput.files) {
                const formData = new FormData();
                formData.append('photo', file);
                await fetch(`${API}/universities/${uniId}/photos`, { method: 'POST', body: formData });
            }
            loadUniversities();
            openUniModal(uniId);
        }

        async function deleteGalleryPhoto(uniId, photoPath) {
            if (!confirm('Delete this photo?')) return;
            await fetch(`${API}/universities/${uniId}/photos`, {
                method: 'DELETE',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ filename: photoPath })
            });
            loadUniversities();
            openUniModal(uniId);
        }

        async function deleteUni(id) { if(confirm('Delete this university?')) { await fetch(`${API}/universities/${id}`, {method:'DELETE'}); loadUniversities(); } }

        // ---------- MAJORS ----------
        async function loadMajors() {
            const [majorsRes, collegesRes] = await Promise.all([
                fetch(`${API}/majors`),
                fetch(`${API}/colleges`)
            ]);
            const majors = await majorsRes.json();
            window.collegesList = await collegesRes.json();
            document.getElementById('mainContent').innerHTML = `
                <div class="topbar"><h1>Majors</h1><button class="btn btn-primary" onclick="openMajorModal()">+ Add Major</button></div>
                <div class="card"><table>
                    <thead><tr><th>ID</th><th>Name</th><th>Degree</th><th>College</th><th>University</th><th>Actions</th></tr></thead>
                    <tbody>${majors.map(m => `
                        <tr><td>${m.Major_ID}</td><td>${m.Name}</td><td>${m.Degree_Type||'-'}</td><td>${m.College_Name}</td><td>${m.University_Name}</td>
                        <td>
                            <button class="btn btn-outline btn-sm" onclick="openMajorModal(${m.Major_ID})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteMajor(${m.Major_ID})">Delete</button>
                        </td></tr>
                    `).join('')}</tbody>
                </table></div>`;
        }

        async function openMajorModal(id = null) {
            const modal = document.getElementById('modal');
            const isEdit = id !== null;
            let major = {Name:'', Degree_Type:'', Duration_Years:'', Description:'', College_ID:''};
            if (isEdit) {
                const res = await fetch(`${API}/majors/${id}`);
                major = await res.json();
            }
            const colleges = window.collegesList || [];
            document.getElementById('modalBody').innerHTML = `
                <h3>${isEdit ? 'Edit' : 'Add'} Major</h3>
                <div class="form-group"><label>Name</label><input id="majorName" value="${major.Name||''}"></div>
                <div class="form-group"><label>Degree Type</label><input id="majorDegree" value="${major.Degree_Type||''}"></div>
                <div class="form-group"><label>Duration (Years)</label><input id="majorDuration" value="${major.Duration_Years||''}" type="number"></div>
                <div class="form-group"><label>Description</label><input id="majorDesc" value="${major.Description||''}"></div>
                <div class="form-group"><label>College</label>
                    <select id="majorCollege">
                        <option value="">Select College</option>
                        ${colleges.map(c => `<option value="${c.College_ID}" ${major.College_ID == c.College_ID ? 'selected' : ''}>${c.Name} (${c.University_Name})</option>`).join('')}
                    </select>
                </div>
                <div class="flex">
                    <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveMajor(${isEdit ? id : null})">Save</button>
                </div>`;
            modal.classList.add('active');
        }

        async function saveMajor(id) {
            const data = {
                Name: document.getElementById('majorName').value,
                Degree_Type: document.getElementById('majorDegree').value,
                Duration_Years: document.getElementById('majorDuration').value,
                Description: document.getElementById('majorDesc').value,
                College_ID: document.getElementById('majorCollege').value
            };
            const url = id ? `${API}/majors/${id}` : `${API}/majors`;
            const method = id ? 'PUT' : 'POST';
            await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
            closeModal();
            loadMajors();
        }
        async function deleteMajor(id) { if(confirm('Delete this major?')) { await fetch(`${API}/majors/${id}`, {method:'DELETE'}); loadMajors(); } }

        // ---------- STUDY PLANS & COURSES ----------
        async function loadStudyPlans() {
            const res = await fetch(`${API}/studyplans`);
            const plans = await res.json();
            document.getElementById('mainContent').innerHTML = `
                <div class="topbar"><h1>Study Plans</h1></div>
                <div class="card">
                    <table>
                        <thead><tr><th>Plan ID</th><th>Plan Name</th><th>Major</th><th>University</th><th>Total Credits</th><th>Actions</th></tr></thead>
                        <tbody>
                            ${plans.map(p => `
                                <tr>
                                    <td>${p.Plan_ID}</td><td>${p.Plan_Name}</td><td>${p.Major_Name}</td><td>${p.University_Name}</td><td>${p.Total_Credit_Hours||'-'}</td>
                                    <td><button class="btn btn-outline btn-sm" onclick="viewCourses(${p.Plan_ID})">Courses</button></td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        async function viewCourses(planId) {
            const res = await fetch(`${API}/studyplans/${planId}/courses`);
            const courses = await res.json();
            const modal = document.getElementById('modal');
            document.getElementById('modalBody').innerHTML = `
                <h3>Courses (Plan ID: ${planId})</h3>
                <div class="card" style="max-height:400px;overflow-y:auto;">
                    <table>
                        <thead><tr><th>Code</th><th>Name</th><th>Credits</th><th>Semester</th><th>Level</th><th>Action</th></tr></thead>
                        <tbody>
                            ${courses.map(c => `
                                <tr><td>${c.Course_Code||'-'}</td><td>${c.Course_Name}</td><td>${c.Credit_Hours}</td><td>${c.Semester_No||'-'}</td><td>${c.Level||'-'}</td>
                                <td><button class="btn btn-danger btn-sm" onclick="deleteCourse(${c.Course_ID}, ${planId})">Delete</button></td></tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
                <form onsubmit="addCourse(event, ${planId})" style="margin-top:15px;display:grid;grid-template-columns:repeat(4,1fr) 1fr;gap:10px;align-items:end;">
                    <input placeholder="Code" id="courseCode" required>
                    <input placeholder="Name" id="courseName" required>
                    <input placeholder="Credits" id="courseCredits" type="number" required>
                    <input placeholder="Semester No" id="courseSemester" type="number">
                    <button class="btn btn-primary" type="submit">Add</button>
                </form>
                <div class="flex" style="margin-top:15px;"><button class="btn btn-outline" onclick="closeModal()">Close</button></div>
            `;
            modal.classList.add('active');
        }

        async function addCourse(e, planId) {
            e.preventDefault();
            const data = {
                Course_Code: document.getElementById('courseCode').value,
                Course_Name: document.getElementById('courseName').value,
                Credit_Hours: document.getElementById('courseCredits').value,
                Semester_No: document.getElementById('courseSemester').value,
                Level: '1'
            };
            await fetch(`${API}/studyplans/${planId}/courses`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            viewCourses(planId);
        }

        async function deleteCourse(courseId, planId) {
            if (confirm('Delete this course?')) {
                await fetch(`${API}/courses/${courseId}`, { method: 'DELETE' });
                viewCourses(planId);
            }
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        // Initial load
        if (currentAdmin) { showTab('dashboard'); }
    </script>
</body>
</html>
