<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduFuture Admin</title>
    <style>
        :root {
            --oxford: #192338;
            --cadet: #1E2E4F;
            --yinmn: #31487A;
            --jordy: #8FB3E2;
            --lavender: #D9E1F1;
            --white: #fff;
            --dark-bg: #0d1117;
            --card-bg: #161b22;
            --border: #30363d;
            --text: #c9d1d9;
            --text-light: #8b949e;
            --accent: #58a6ff;
            --danger: #f85149;
            --success: #3fb950;
            --warning: #d2991d;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--dark-bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 240px; background: var(--card-bg); border-right: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; flex-shrink: 0; }
        .sidebar h2 { font-size: 20px; margin-bottom: 30px; color: var(--jordy); }
        .sidebar nav a { display: block; padding: 10px 15px; color: var(--text-light); text-decoration: none; border-radius: 8px; margin-bottom: 5px; cursor: pointer; transition: 0.2s; }
        .sidebar nav a:hover, .sidebar nav a.active { background: var(--yinmn); color: white; }
        .main { flex: 1; overflow-y: auto; padding: 30px; }
        .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .topbar h1 { font-size: 28px; }
        .btn { padding: 8px 18px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
        .btn-primary { background: var(--yinmn); color: white; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
        .btn-danger { background: var(--danger); color: white; }
        .btn-sm { padding: 4px 10px; font-size: 12px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        .stat-card h3 { font-size: 36px; color: var(--accent); }
        .stat-card p { color: var(--text-light); margin-top: 5px; }
        .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-light); font-weight: 600; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal.active { display: flex; }
        .modal-content { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 30px; width: 500px; max-width: 90%; max-height: 80vh; overflow-y: auto; }
        .modal-content h3 { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: var(--text-light); }
        .form-group input, .form-group select { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--dark-bg); color: var(--text); }
        .flex { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .status { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .status.accepted { background: rgba(63,185,80,0.2); color: var(--success); }
        .status.rejected { background: rgba(248,81,73,0.2); color: var(--danger); }
        .status.pending { background: rgba(210,153,29,0.2); color: var(--warning); }
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .main { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>🎓 EduFuture</h2>
        <nav>
            <a class="active" onclick="showTab('dashboard', this)">📊 Dashboard</a>
            <a onclick="showTab('students', this)">👨‍🎓 Students</a>
            <a onclick="showTab('applications', this)">📝 Applications</a>
            <a onclick="showTab('universities', this)">🏛️ Universities</a>
            <a onclick="showTab('majors', this)">🎓 Majors</a>
            <a onclick="showTab('fees', this)">💰 Fees</a>
            <a onclick="showTab('studyplans', this)">📚 Study Plans</a>
        </nav>
        <div style="margin-top:auto;">
            <button class="btn btn-outline" onclick="adminLogout()" style="width:100%">🚪 Logout</button>
        </div>
    </div>
    <div class="main" id="mainContent"></div>
    <div id="modal" class="modal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script>
        const API = window.location.origin + '/api/admin';
        const currentAdmin = JSON.parse(localStorage.getItem('adminUser') || 'null');
        if (!currentAdmin) {
            document.body.innerHTML = `
                <div style="display:flex;align-items:center;justify-content:center;height:100vh;background:var(--dark-bg);">
                    <div class="card" style="width:400px;padding:30px;">
                        <h2 style="margin-bottom:20px;color:var(--jordy);">Admin Login</h2>
                        <form onsubmit="adminLogin(event)">
                            <div class="form-group"><input type="email" id="adminEmail" placeholder="Email" required style="width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;background:var(--dark-bg);color:var(--text);"></div>
                            <div class="form-group"><input type="password" id="adminPassword" placeholder="Password" required style="width:100%;padding:12px;border:1px solid var(--border);border-radius:6px;background:var(--dark-bg);color:var(--text);"></div>
                            <button type="submit" class="btn btn-primary" style="width:100%">Login</button>
                        </form>
                        <div id="loginMsg" style="margin-top:15px;color:var(--danger);"></div>
                    </div>
                </div>`;
        }

        function adminLogin(e) {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            fetch(`${API}/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({email, password})
            })
            .then(r => r.json())
            .then(data => {
                if (data.admin) {
                    localStorage.setItem('adminUser', JSON.stringify(data.admin));
                    location.reload();
                } else {
                    document.getElementById('loginMsg').textContent = 'Invalid credentials';
                }
            });
        }

        function adminLogout() { localStorage.removeItem('adminUser'); location.reload(); }

        function showTab(tab, el) {
            document.querySelectorAll('.sidebar nav a').forEach(a => a.classList.remove('active'));
            if (el) el.classList.add('active');
            switch(tab) {
                case 'dashboard': loadDashboard(); break;
                case 'students': loadStudents(); break;
                case 'applications': loadApplications(); break;
                case 'universities': loadUniversities(); break;
                case 'majors': loadMajors(); break;
                case 'fees': loadFees(); break;
                case 'studyplans': loadStudyPlans(); break;
            }
        }

        // Dashboard / Students / Applications / Universities / Majors / StudyPlans functions remain exactly as before...
        // (I'm omitting them here for brevity – they are unchanged from your existing admin.html)

        // ---------- FEES ----------
        async function loadFees() {
            const res = await fetch(`${API}/fees`);
            const fees = await res.json();
            document.getElementById('mainContent').innerHTML = `
                <div class="topbar"><h1>💰 Fees</h1><button class="btn btn-primary" onclick="openFeeModal()">+ Add Fee</button></div>
                <div class="card"><table>
                    <thead><tr><th>ID</th><th>Major</th><th>University</th><th>Tuition</th><th>Registration</th><th>Other</th><th>Total</th><th>Year</th><th>Actions</th></tr></thead>
                    <tbody>${fees.map(f => {
                        const total = (parseFloat(f.Tuition_Fee)||0)+(parseFloat(f.Registration_Fee)||0)+(parseFloat(f.Other_Fees)||0);
                        return `<tr><td>${f.Fee_ID}</td><td>${f.Major_Name}</td><td>${f.University_Name}</td><td>${parseFloat(f.Tuition_Fee||0).toLocaleString()}</td><td>${parseFloat(f.Registration_Fee||0).toLocaleString()}</td><td>${parseFloat(f.Other_Fees||0).toLocaleString()}</td><td><strong>${total.toLocaleString()}</strong></td><td>${f.Academic_Year||'-'}</td>
                        <td>
                            <button class="btn btn-outline btn-sm" onclick="openFeeModal(${f.Fee_ID})">Edit</button>
                            <button class="btn btn-danger btn-sm" onclick="deleteFee(${f.Fee_ID})">Delete</button>
                        </td></tr>`;
                    }).join('')}</tbody>
                </table></div>`;
        }

        async function openFeeModal(id = null) {
            const modal = document.getElementById('modal');
            const isEdit = id !== null;
            let fee = {Tuition_Fee:'', Registration_Fee:'', Other_Fees:'', Currency:'EGP', Academic_Year:'2025/2026', Major_ID:''};
            if (isEdit) {
                const res = await fetch(`${API}/fees/${id}`);
                fee = await res.json();
            }
            const [majorsRes] = await Promise.all([fetch(`${API}/majors`)]);
            const majors = await majorsRes.json();
            document.getElementById('modalBody').innerHTML = `
                <h3>${isEdit ? 'Edit' : 'Add'} Fee</h3>
                <div class="form-group"><label>Major</label>
                    <select id="feeMajor">
                        <option value="">Select Major</option>
                        ${majors.map(m => `<option value="${m.Major_ID}" ${fee.Major_ID == m.Major_ID ? 'selected' : ''}>${m.Name} (${m.University_Name})</option>`).join('')}
                    </select>
                </div>
                <div class="form-group"><label>Tuition Fee</label><input type="number" id="feeTuition" value="${fee.Tuition_Fee||''}"></div>
                <div class="form-group"><label>Registration Fee</label><input type="number" id="feeReg" value="${fee.Registration_Fee||''}"></div>
                <div class="form-group"><label>Other Fees</label><input type="number" id="feeOther" value="${fee.Other_Fees||''}"></div>
                <div class="form-group"><label>Currency</label><input id="feeCurrency" value="${fee.Currency||'EGP'}"></div>
                <div class="form-group"><label>Academic Year</label><input id="feeYear" value="${fee.Academic_Year||'2025/2026'}"></div>
                <div class="flex">
                    <button class="btn btn-outline" onclick="closeModal()">Cancel</button>
                    <button class="btn btn-primary" onclick="saveFee(${isEdit ? id : null})">Save</button>
                </div>`;
            modal.classList.add('active');
        }

        async function saveFee(id) {
            const data = {
                Tuition_Fee: document.getElementById('feeTuition').value,
                Registration_Fee: document.getElementById('feeReg').value,
                Other_Fees: document.getElementById('feeOther').value,
                Currency: document.getElementById('feeCurrency').value,
                Academic_Year: document.getElementById('feeYear').value,
                Major_ID: document.getElementById('feeMajor').value
            };
            const url = id ? `${API}/fees/${id}` : `${API}/fees`;
            const method = id ? 'PUT' : 'POST';
            await fetch(url, {method, headers:{'Content-Type':'application/json'}, body:JSON.stringify(data)});
            closeModal();
            loadFees();
        }

        async function deleteFee(id) {
            if (confirm('Delete this fee record?')) {
                await fetch(`${API}/fees/${id}`, {method:'DELETE'});
                loadFees();
            }
        }

        function closeModal() { document.getElementById('modal').classList.remove('active'); }

        // Initial load
        if (currentAdmin) { showTab('dashboard'); }
    </script>
</body>
</html>
