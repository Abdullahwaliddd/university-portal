<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - EduFuture</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="ai-widget.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <div class="logo"><a href="index.html" class="logo-text">Edu<span class="logo-highlight">Future</span></a></div>
            <div class="nav-buttons">
                <a href="index.html" class="btn-outline">Home</a>
                <a href="login.html" class="btn-outline">Login</a>
            </div>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Create Account</h2>
            <p>All fields are required</p>
            
            <div id="registerStep1">
                <form onsubmit="handleRegister(event)">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name *</label>
                            <input type="text" id="regFirstName" required>
                        </div>
                        <div class="form-group">
                            <label>Last Name *</label>
                            <input type="text" id="regLastName" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="regEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Password * (min 8 characters)</label>
                        <input type="password" id="regPassword" minlength="8" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Gender *</label>
                            <select id="regGender" required>
                                <option value="">Select</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Date of Birth *</label>
                            <input type="date" id="regDOB" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Phone *</label>
                        <input type="text" id="regPhone" required>
                    </div>
                    <div class="form-group">
                        <label>Address *</label>
                        <input type="text" id="regAddress" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Send Verification Code</button>
                </form>
            </div>

            <div id="registerStep2" style="display:none;">
                <p style="color:#31487A;">A verification code has been sent to your email.</p>
                <div id="fallbackMessage" style="display:none; background:#fff3cd; padding:12px; border-radius:8px; margin-bottom:15px;">
                    ⚠️ Email could not be sent. Your verification code is: <strong id="fallbackCode"></strong>
                </div>
                <form onsubmit="verifyAndRegister(event)">
                    <div class="form-group">
                        <label>Verification Code *</label>
                        <input type="text" id="verificationCode" maxlength="6" required>
                    </div>
                    <button type="submit" class="btn-primary btn-full">Verify & Register</button>
                </form>
            </div>

            <p class="auth-link">Already have an account? <a href="login.html">Login here</a></p>
            <div id="registerMessage" class="message"></div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="ai-widget.js"></script>
</body>
</html>
